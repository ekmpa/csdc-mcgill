name: Sync Outlook Calendar events

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-calendar-events:
    runs-on: ubuntu-latest
    env:
      CALENDAR_AUTOMERGE_TOKEN: ${{ secrets.CALENDAR_AUTOMERGE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python requirements
        run: pip install -r src/python/requirements.txt

      - name: Sync Outlook Calendar events
        run: python -m src.python.sync_outlook_calendar_events
        env:
          OUTLOOK_CALENDAR_HTML_URL: ${{ vars.OUTLOOK_CALENDAR_HTML_URL }}
          OUTLOOK_CALENDAR_ICS_URL: ${{ vars.OUTLOOK_CALENDAR_ICS_URL }}

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ env.CALENDAR_AUTOMERGE_TOKEN != '' && env.CALENDAR_AUTOMERGE_TOKEN || github.token }}
          delete-branch: true
          branch-suffix: timestamp
          branch: gh-actions/sync-calendar-events
          commit-message: "[GH Actions] Sync Outlook Calendar events"
          title: "[Automatic PR] Sync Outlook Calendar events"
          body: |
            Automatically syncs Outlook Calendar events to `_data/events.yml`.

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number != '' && env.CALENDAR_AUTOMERGE_TOKEN == ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}
          merge-method: squash

      - name: Request auto-merge via gh
        if: steps.create-pr.outputs.pull-request-number != '' && env.CALENDAR_AUTOMERGE_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" --squash --auto

      - name: Auto-approve PR (optional)
        if: steps.create-pr.outputs.pull-request-number != '' && env.CALENDAR_AUTOMERGE_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.CALENDAR_AUTOMERGE_TOKEN }}
        run: gh pr review "${{ steps.create-pr.outputs.pull-request-number }}" --approve

      - name: Merge PR with admin token (optional)
        if: steps.create-pr.outputs.pull-request-number != '' && env.CALENDAR_AUTOMERGE_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.CALENDAR_AUTOMERGE_TOKEN }}
        run: gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" --squash --delete-branch --admin
