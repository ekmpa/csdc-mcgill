name: Run tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"


jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python requirements
        run: pip install -r src/python/requirements.txt

      - name: Run tests
        run: python -m unittest
